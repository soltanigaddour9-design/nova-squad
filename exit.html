<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Nova Exit Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Mission console: one deliberate dark look. Hero colors mark the four orbs. */
:root{
  --void:#070B1A; --panel:#0F1730; --panel2:#16213F; --line:#2A3A66; --text:#EAF0FF; --muted:#A3B0D6;
  --gold:#F5C542; --sand:#FF8A3D; --cyan:#3FD8FF; --green:#52F59A; --violet:#B07CFF; --bad:#FF6478; --ok:#52F59A;
  --display:"Bungee","Arial Black",Impact,sans-serif; --body:"Lexend","Segoe UI",Roboto,Arial,sans-serif; --label:"Chakra Petch","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--void);color:var(--text);font-family:var(--body);font-size:18px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(1200px 600px at 85% -10%,rgba(176,124,255,.18),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,rgba(63,216,255,.12),transparent 60%);}
.wrap{position:relative;max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-family:var(--label);font-weight:700;letter-spacing:.18em;font-size:13px;color:var(--muted);text-transform:uppercase}
.brand b{color:var(--violet)}
.who{margin-left:auto;font-family:var(--label);font-weight:600;font-size:14px;color:var(--muted)}
.who b{color:var(--text)}
h1{font-family:var(--display);font-weight:400;letter-spacing:.02em;margin:0;line-height:1.02;text-wrap:balance}
.hero-title{font-size:clamp(40px,8vw,84px);background:linear-gradient(180deg,#fff 10%,#d9c7ff 60%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(176,124,255,.45))}
.kicker{font-family:var(--label);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:14px;color:var(--gold)}
.lead{color:var(--muted);max-width:60ch;margin:10px 0 0}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:22px}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:56px;padding:12px 22px;font-family:var(--label);font-weight:700;letter-spacing:.06em;font-size:18px;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn-main{background:linear-gradient(180deg,#c9a6ff,var(--violet));color:#160a2e;box-shadow:0 8px 26px rgba(176,124,255,.35)}
.btn-main:active{transform:translateY(1px)}
.btn-main.sent{background:linear-gradient(180deg,#9ff5c4,var(--ok));color:#06261a}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}
label.f{display:block;font-family:var(--label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=text],textarea{width:100%;font:inherit;font-size:20px;color:var(--text);background:#0a1126;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:110px;resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
/* start screen */
.start{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
@media (max-width:820px){.start{grid-template-columns:1fr}}
.start-art{position:relative;aspect-ratio:3/2;border-radius:20px;overflow:hidden;border:1px solid var(--line);max-width:100%}
.start-art img{width:100%;height:100%;object-fit:cover;display:block}
.steps{display:grid;gap:10px;margin:18px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:17px}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1.5px solid var(--violet);font-family:var(--label);font-weight:700;color:var(--violet)}
/* orb tracker */
.tracker{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.orb{position:relative;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0}
.orb img{width:46px;height:46px;flex:none;border-radius:50%;transition:filter .4s,transform .4s}
.orb .nm{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.1em;min-width:0}
.orb .pips{display:flex;gap:4px;margin-top:4px}
.orb .pips i{width:14px;height:6px;border-radius:3px;background:#24325a}
.orb .pips i.hit{background:var(--c)}
.orb .pips i.miss{background:var(--bad)}
.orb.now{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 24px -4px var(--c)}
.orb.done img{filter:grayscale(1) brightness(.5)}
.orb.done::after{content:"BROKEN";position:absolute;right:8px;top:6px;font-family:var(--label);font-size:10px;letter-spacing:.14em;color:var(--c)}
@media (max-width:640px){.orb .nm{display:none}.orb{justify-content:center}}
/* play */
.play{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
@media (max-width:760px){.play{grid-template-columns:1fr}.herobox{display:none}}
.herobox{position:relative;border-radius:18px;border:1px solid var(--line);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 28%,transparent),transparent 65%),var(--panel);height:380px;overflow:hidden}
.herobox img{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);height:96%;filter:grayscale(.85) brightness(.75);transition:filter .6s}
.herobox.lit img{filter:none;animation:bob 2.4s ease-in-out infinite}
.herobox .cap{position:absolute;left:12px;top:10px;font-family:var(--label);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--c)}
@keyframes bob{50%{transform:translate(-50%,-10px)}}
.q .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--label);font-weight:700;letter-spacing:.14em;font-size:13px;text-transform:uppercase;color:var(--c)}
.q .ask{color:var(--muted);margin:12px 0 6px;font-size:17px}
.q .sent{font-size:clamp(22px,3.4vw,30px);font-weight:600;line-height:1.35;margin:4px 0 18px}
.gap{display:inline-block;min-width:4.2em;border-bottom:3px dashed var(--c);color:var(--c);text-align:center}
.hl{color:var(--c);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{background:#0b1430;color:var(--text);border:2px solid var(--line);text-transform:none;letter-spacing:.01em;font-family:var(--body);font-weight:600;font-size:21px;min-height:64px}
.opt.wide{font-size:18px;text-align:left;justify-content:flex-start;padding:14px 18px}
.opts.two{grid-template-columns:1fr 1fr}
@media (max-width:560px){.opts.two{grid-template-columns:1fr}}
.opt:hover{border-color:var(--c)}
.opt.right{border-color:var(--ok);background:rgba(82,245,154,.14)}
.opt.wrong{border-color:var(--bad);background:rgba(255,100,120,.14)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#0b1430;color:var(--text);border:2px solid var(--line);text-transform:none;font-family:var(--body);font-weight:600;font-size:22px;min-height:56px;padding:8px 16px;letter-spacing:0}
.chip.right{border-color:var(--ok);background:rgba(82,245,154,.14)}
.chip.wrong{border-color:var(--bad);background:rgba(255,100,120,.14)}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;border:1.5px solid;display:flex;gap:12px;align-items:flex-start}
.fb.good{border-color:var(--ok);background:rgba(82,245,154,.08)}
.fb.bad{border-color:var(--bad);background:rgba(255,100,120,.08)}
.fb .ic{font-family:var(--display);font-size:24px;line-height:1}
.fb.good .ic{color:var(--ok)} .fb.bad .ic{color:var(--bad)}
.fb p{margin:0}
.fb .t{font-weight:700;margin-bottom:2px}
.next{margin-top:16px;display:flex;justify-content:flex-end}
/* orb broken overlay */
.overlay{position:fixed;inset:0;background:rgba(4,6,16,.86);display:grid;place-items:center;z-index:10;padding:16px}
.burst{position:relative;text-align:center;max-width:520px}
.burst .orbbig{width:min(240px,55vw);height:auto;animation:shatter 1.1s ease-in forwards}
.burst .heroin{position:absolute;left:50%;top:-10px;height:min(330px,60vh);transform:translateX(-50%) scale(.6);opacity:0;animation:heroin .9s .9s cubic-bezier(.2,1.4,.4,1) forwards}
.burst h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,40px);margin:24px 0 6px;color:var(--c);opacity:0;animation:fadein .5s 1.4s forwards}
.burst p{margin:0;color:var(--muted);opacity:0;animation:fadein .5s 1.6s forwards}
.burst .btn{margin-top:20px;opacity:0;animation:fadein .5s 1.9s forwards}
.spacer{height:min(330px,60vh)}
@keyframes shatter{0%{transform:scale(1);filter:none}35%{transform:scale(1.12) rotate(-4deg);filter:brightness(1.6)}55%{transform:scale(.96) rotate(3deg)}100%{transform:scale(1.9);opacity:0;filter:brightness(3) blur(6px)}}
@keyframes heroin{to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes fadein{to{opacity:1}}
/* report */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:clamp(56px,10vw,96px);line-height:1;color:var(--gold)}
.rank{font-family:var(--label);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--violet)}
.rev{display:grid;gap:10px;margin-top:16px}
.rev .r{background:#0b1430;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:12px 14px}
.rev .r b{color:var(--c)}
.send{margin-top:22px;border:1.5px dashed var(--violet);border-radius:16px;padding:16px;display:grid;gap:10px}
.send small{color:var(--muted);font-size:15px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* exit */
.exit-hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;margin-bottom:18px}
@media (max-width:760px){.exit-hero{grid-template-columns:1fr}}
.egg{aspect-ratio:3/2;border-radius:18px;overflow:hidden;border:1px solid var(--line);position:relative;max-width:100%}
.egg img{width:100%;height:100%;object-fit:cover;display:block;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.25) saturate(1.2)}}
.qs{display:grid;gap:14px}
.qq .n{font-family:var(--label);font-weight:700;letter-spacing:.14em;color:var(--violet);font-size:13px;text-transform:uppercase}
.qq .p{font-size:20px;font-weight:600;margin:6px 0 12px}
.qq .p u{text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:5px}
.qq .tip{color:var(--muted);font-size:15px;margin:-6px 0 10px}
.res{margin-top:8px;font-size:16px}
.res.good{color:var(--ok)} .res.bad{color:var(--bad)}
.stars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stars .opt{font-size:17px;flex-direction:column;gap:2px;min-height:76px}
.stars .opt span{font-size:22px;color:var(--gold)}
.opt.sel{border-color:var(--violet);background:rgba(176,124,255,.16)}
.err{color:var(--bad);font-size:15px;margin-top:8px;min-height:1.2em}
.ingw{color:var(--gold);font-weight:700;text-decoration:underline;text-underline-offset:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.burst .heroin,.burst h2,.burst p,.burst .btn{opacity:1}}
</style>

</head><body><div class="wrap" id="app">
  <div class="bar"><span class="brand"><b>NOVA SQUAD</b> · Rimal City · Mr. Khalil’s cadets</span><span class="who" id="who"></span></div>
  <main id="screen"></main>
</div>

<script>
(function(){
const MODE = "exit";               // "orbs" or "exit"
const TOPIC = "nova-ahs7-h9sxl4r7st";  // private results channel for the teacher's Command Center
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const screen = $('#screen');
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem('nova_'+MODE+'_'+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('nova_'+MODE+'_'+k, JSON.stringify(v)); }catch(e){} }
};
function sendHref(title, msg){
  return 'https://ntfy.sh/' + TOPIC + '/publish?title=' + encodeURIComponent(title) + '&message=' + encodeURIComponent(msg);
}
async function sendReport(title, msg, btn, doneText){
  btn.disabled = true; btn.textContent = 'Sending…';
  try{
    await fetch('https://ntfy.sh/' + TOPIC + '?title=' + encodeURIComponent(title), {method:'POST', body:msg, mode:'no-cors'});
    btn.textContent = doneText; btn.classList.add('sent');
  }catch(e){
    btn.disabled = false; btn.textContent = 'Not sent. Tap to try again';
  }
}
const shared = {
  get(){ try{ return JSON.parse(localStorage.getItem('nova_cadet')); }catch(e){ return null; } },
  set(v){ try{ localStorage.setItem('nova_cadet', JSON.stringify(v)); }catch(e){} }
};
const cadet = shared.get() || {name:'', cls:''};
function showWho(){ $('#who').innerHTML = cadet.name ? 'Cadet <b>' + esc(cadet.name) + '</b> · ' + esc(cadet.cls) : ''; }

function cadetForm(title, kick, blurb, img, steps, btn){
  screen.innerHTML = `
  <section class="start">
    <div>
      <div class="kicker">${kick}</div>
      <h1 class="hero-title">${title}</h1>
      <p class="lead">${blurb}</p>
      <ol class="steps">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>
      <div class="card" style="margin-top:20px">
        <div class="grid2">
          <div><label class="f" for="nm">Cadet code (your initials or class number)</label><input type="text" id="nm" maxlength="24" autocomplete="off" placeholder="e.g. OK or 14" value="${esc(cadet.name)}"></div>
          <div><label class="f" for="cl">Class</label><input type="text" id="cl" maxlength="8" autocomplete="off" placeholder="7A" value="${esc(cadet.cls)}"></div>
        </div>
        <div class="err" id="err"></div>
        <button class="btn-main" id="go" style="width:100%;margin-top:6px">${btn}</button>
      </div>
    </div>
    <div class="start-art"><img src="${img}" alt=""></div>
  </section>`;
  return new Promise(res => {
    $('#go').onclick = () => {
      const n = $('#nm').value.trim(), c = $('#cl').value.trim().toUpperCase();
      if(!n){ $('#err').textContent = 'Type your cadet code (initials or class number) so your teacher can see your report.'; $('#nm').focus(); return; }
      if(!c){ $('#err').textContent = 'Type your class, for example 7A.'; $('#cl').focus(); return; }
      cadet.name = n; cadet.cls = c; shared.set(cadet); showWho(); res();
    };
  });
}

  {t:'gap', s:'Byte saw a ___ light on the orb.', o:['blink','blinking','blinks'], a:1, why:'Before the noun <b>light</b> we need an -ing word with an ADJECTIVE job: a <b>blinking</b> light (a participle).'}

const SCAN = {gerund:'◆ GERUND: -ing with a NOUN job', part:'⚡ PARTICIPLE: -ing with a VERB job or an ADJECTIVE job', verb:'▶ VERB: the main action, no -ing'};
const TOTAL = ORBS.reduce((n,o)=>n+o.items.length,0);

function orbs(){
  let st = store.get('state') || {o:0,i:0,res:[],start:Date.now(),sent:false};
  const tracker = () => `<div class="tracker">${ORBS.map((ob,k)=>{
      const r = st.res.slice(k*3,k*3+3);
      const cls = k<st.o ? 'done' : (k===st.o ? 'now' : '');
      return `<div class="orb ${cls}" style="--c:${ob.c}"><img src="${ob.orb}" alt=""><div><div class="nm">${ob.power}</div><div class="pips">${[0,1,2].map(j=>`<i class="${r[j]===true?'hit':(r[j]===false?'miss':'')}"></i>`).join('')}</div></div></div>`;
    }).join('')}</div>`;

  function play(){
    if(st.o >= ORBS.length) return report();
    const ob = ORBS[st.o], it = ob.items[st.i], n = st.o*3 + st.i + 1;
    let body = '';
    if(it.t==='gap'){
      body = `<div class="ask">Choose the correct word.</div>
      <div class="sent">${it.s.replace('___','<span class="gap">?</span>')}</div>
      <div class="opts">${it.o.map((x,j)=>`<button class="opt" data-j="${j}">${x}</button>`).join('')}</div>`;
    } else if(it.t==='scan'){
      body = `<div class="ask">Byte’s scanner: what is the underlined word?</div>
      <div class="sent">${it.s.replace('<u>','<span class="hl">').replace('</u>','</span>')}</div>
      <div class="opts" style="grid-template-columns:1fr">
        ${Object.entries(SCAN).map(([k,v])=>`<button class="opt wide" data-j="${k}">${v}</button>`).join('')}
      </div>`;
    } else {
      body = `<div class="ask">Error hunt: tap the word that is wrong.</div>
      <div class="chips" style="margin:6px 0 4px">${it.w.map((x,j)=>`<button class="chip" data-j="${j}">${x}</button>`).join('')}</div>`;
    }
    screen.innerHTML = tracker() + `
    <section class="play" style="--c:${ob.c}">
      <div class="herobox" id="hb"><span class="cap">${ob.hero.toUpperCase()} · POWER LOCKED</span><img src="${ob.img}" alt="${ob.hero}"></div>
      <div class="card q">
        <div class="meta"><span>Orb ${st.o+1} · ${ob.power}</span><span>Lock ${st.i+1} of 3 · Question ${n} of ${TOTAL}</span></div>
        ${body}
        <div id="fb"></div>
      </div>
    </section>`;
    screen.querySelectorAll('[data-j]').forEach(b => b.onclick = () => answer(b));
  }

  function answer(b){
    const ob = ORBS[st.o], it = ob.items[st.i];
    const all = screen.querySelectorAll('[data-j]');
    all.forEach(x => x.disabled = true);
    let ok, rightLabel;
    if(it.t==='gap'){ ok = +b.dataset.j === it.a; rightLabel = it.o[it.a];
      all[it.a].classList.add('right'); if(!ok) b.classList.add('wrong'); }
    else if(it.t==='scan'){ ok = b.dataset.j === it.a; rightLabel = SCAN[it.a].replace(/^\S+\s/,'');
      screen.querySelector(`[data-j="${it.a}"]`).classList.add('right'); if(!ok) b.classList.add('wrong'); }
    else { ok = +b.dataset.j === it.a; rightLabel = `${it.w[it.a]} → ${it.fix}`;
      all[it.a].classList.add('right'); all[it.a].textContent = it.fix; if(!ok) b.classList.add('wrong'); }
    st.res.push(ok); store.set('state', st);
    $('#fb').innerHTML = `<div class="fb ${ok?'good':'bad'}"><span class="ic">${ok?'✓':'✗'}</span><div><p class="t">${ok?'Lock cracked!':'Not quite. The answer is: '+rightLabel}</p><p>${it.why}</p></div></div>
      <div class="next"><button class="btn-main" id="nx">${st.i===2 ? 'Break the orb' : 'Next lock'} →</button></div>`;
    $('#nx').focus();
    $('#nx').onclick = () => {
      if(st.i===2){ st.o++; st.i=0; store.set('state', st); burst(ob); }
      else { st.i++; store.set('state', st); play(); }
    };
  }

  function burst(ob){
    const ov = document.createElement('div'); ov.className = 'overlay'; ov.style.setProperty('--c', ob.c);
    ov.innerHTML = `<div class="burst"><div class="spacer" style="position:relative"><img class="orbbig" src="${ob.orb}" alt="" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)"><img class="heroin" src="${ob.img}" alt="${ob.hero}"></div>
      <h2>${ob.power} RESTORED!</h2><p>${ob.hero} has his power back.</p><button class="btn btn-main" id="cont">${st.o>=ORBS.length?'See mission report':'Next orb'} →</button></div>`;
    document.body.appendChild(ov);
    $('#cont', ov).onclick = () => { ov.remove(); play(); };
  }

  function report(){
    const score = st.res.filter(Boolean).length;
    const missed = []; st.res.forEach((r,k)=>{ if(!r) missed.push(k+1); });
    const secs = Math.round((Date.now()-st.start)/1000), mm = Math.floor(secs/60), ss = String(secs%60).padStart(2,'0');
    const rank = score>=11?'Nova Commander':score>=8?'Elite Cadet':score>=5?'Cadet':'Trainee';
    const msg = `ORB|${cadet.name}|${cadet.cls}|${score}/${TOTAL}|missed:${missed.join(',')||'none'}|time:${mm}:${ss}`;
    const rev = missed.map(k => { const ob = ORBS[Math.floor((k-1)/3)], it = ob.items[(k-1)%3];
      const s = it.t==='fix' ? it.w.join(' ').replace(it.w[it.a], `<b>${it.fix}</b>`) : (it.t==='gap' ? it.s.replace('___', `<b>${it.o[it.a]}</b>`) : it.s.replace('<u>','<b>').replace('</u>','</b>'));
      return `<div class="r" style="--c:${ob.c}"><div style="font-weight:600;margin-bottom:4px">Q${k}. ${s}</div><div style="color:var(--muted);font-size:16px">${it.why}</div></div>`; }).join('');
    screen.innerHTML = tracker() + `
    <section class="card">
      <div class="kicker">Mission report · Orb Breaker</div>
      <div class="score" style="margin-top:10px"><div class="big">${score}/${TOTAL}</div><div><div class="rank">${rank}</div><div style="color:var(--muted)">All four orbs broken in ${mm}:${ss}</div></div></div>
      ${missed.length ? `<h3 style="font-family:var(--label);letter-spacing:.12em;text-transform:uppercase;font-size:15px;margin:20px 0 0;color:var(--muted)">Check these again</h3><div class="rev">${rev}</div>` : `<p style="margin-top:16px;font-size:19px">Perfect mission. Every lock cracked on the first try!</p>`}
      <div class="send">
        <div class="kicker" style="color:var(--violet)">Last step</div>
        <button class="btn-main" id="send">Send report to Mr. Khalil</button>
        <small>Not working? <a href="${sendHref('ORB', msg)}" target="_blank" rel="noopener" style="color:var(--cyan)">Use the backup link</a> (it opens a new tab; then come back here).</small>
      </div>
      <div class="row" style="margin-top:16px"><button class="btn-ghost" id="again">Practice again</button></div>
    </section>`;
    $('#send').onclick = () => { st.sent = true; store.set('state', st); sendReport('ORB', msg, $('#send'), 'Report sent ✓'); };
    $('#again').onclick = () => { st = {o:0,i:0,res:[],start:Date.now(),sent:false}; store.set('state', st); play(); };
  }

  const begin = () => (st.o===0 && st.i===0 && !st.res.length) ? (st.start = Date.now(), play()) : play();
  if(cadet.name && st.res.length) { showWho(); begin(); }
